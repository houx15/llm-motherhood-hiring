# Claims registry (Draft 6): every number in the short abstract, extended
# summary, and the §4.1/4.2 tables. rules: see claims_check._fmt.
claims:
  # ---- header / abstract ----
  - id: abs_calls
    section: abstract
    rendered: "616,419"
    source: {file: docs/final/study_totals.json, key: grand_total.calls_excl_coding}
    rule: thousands_int
  - id: abs_amplification
    section: abstract
    rendered: "3.5–38×"
    source: {file: docs/phase3/round6_stats.json, key: "amplification.*.parent*.amplification_ratio"}
    rule: minmax_1dp_nonnull
  - id: abs_share_max
    section: abstract
    rendered: "up to 77% of shortlist probability"
    source: {file: docs/report/stats.json, key: "models.*.e3_fe.*.adjusted_ratio"}
    rule: one_minus_min_pct
  - id: abs_haiku_fit
    section: abstract
    rendered: "scoring parents *higher* yet choosing them 23% of the time"
    source: {file: docs/report/stats.json, key: models.claude_haiku_55.e1_gaps_women.overall_fit.parent_minus_none}
    rule: sentence_with_signed_2dp_and_pct
  - id: abs_haiku_choice
    section: abstract
    rendered: "scoring parents *higher* yet choosing them 23% of the time"
    source: {file: docs/report/stats.json, key: "models.claude_haiku_55.e2_clustered.cells.parent|female.p"}
    rule: pct_int
  # ---- finding 2 (decomposition ranges) ----
  - id: f2_interruption
    section: "§4.2"
    rendered: "costs 10.5–26.0pp"
    source: {file: docs/phase3/round5_stats.json, key: "primary_decomposition.*.cell_gap_travel.P"}
    rule: penalty_range_pp_1dp
  - id: f2_bundle
    section: "§4.2"
    rendered: "adds a further 10.6–17.4pp"
    source: {file: docs/phase3/round5_stats.json, key: "primary_decomposition.*.bundle.diff"}
    rule: range_abs_pp_1dp
  - id: f2_parenthood
    section: "§4.2"
    rendered: "7.3–19.2"
    source: {file: docs/phase3/round5_stats.json, key: "primary_decomposition.*.parenthood.diff"}
    rule: range_abs_pp_1dp_bare
  - id: f2_personal
    section: "§4.2"
    rendered: "costs 2.9–3.5pp in DeepSeek, Luna, and Qwen"
    source: {file: docs/phase3/round5_stats.json, key: "primary_decomposition.*.cell_personal.P"}
    rule: personal_subset_pp_1dp
  - id: f2_personal_haiku
    section: "§4.2"
    rendered: "raises Haiku's choice share by 3.7pp"
    source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.haiku.cell_personal.P}
    rule: pct_1dp_signed
  - id: f2_tost
    section: "§4.2"
    rendered: "7 of 8 model×cue"
    source: {file: docs/phase3/round6_stats.json, key: "equivalence.*"}
    rule: tost_count_7_of_8
  # ---- §4.2 decomposition table: 16 cells (4 components x 4 models) ----
  - {id: dec_int_ds, section: "§4.2 table", rendered: "−10.5pp (t −8.0)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.deepseek.cell_gap_travel}, rule: cell_p_t}
  - {id: dec_int_haiku, section: "§4.2 table", rendered: "−18.4pp (t −8.5)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.haiku.cell_gap_travel}, rule: cell_p_t}
  - {id: dec_int_luna, section: "§4.2 table", rendered: "−26.0pp (t −7.3)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.luna.cell_gap_travel}, rule: cell_p_t}
  - {id: dec_int_qwen, section: "§4.2 table", rendered: "−22.4pp (t −8.9)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.qwen.cell_gap_travel}, rule: cell_p_t}
  - {id: dec_par_ds, section: "§4.2 table", rendered: "−10.4pp [−12.8, −8.0] (t −8.5)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.deepseek.parenthood}, rule: cell_ci_t}
  - {id: dec_par_haiku, section: "§4.2 table", rendered: "−19.2pp [−23.4, −15.0] (t −8.9)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.haiku.parenthood}, rule: cell_ci_t}
  - {id: dec_par_luna, section: "§4.2 table", rendered: "−12.1pp [−16.3, −7.9] (t −5.6)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.luna.parenthood}, rule: cell_ci_t}
  - {id: dec_par_qwen, section: "§4.2 table", rendered: "−7.3pp [−10.3, −4.3] (t −4.7)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.qwen.parenthood}, rule: cell_ci_t}
  - {id: dec_lab_ds, section: "§4.2 table", rendered: "+1.7pp [+0.5, +2.9] (t 2.7)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.deepseek.label}, rule: cell_ci_t}
  - {id: dec_lab_haiku, section: "§4.2 table", rendered: "−1.1pp [−3.2, +0.9] (t −1.1)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.haiku.label}, rule: cell_ci_t}
  - {id: dec_lab_luna, section: "§4.2 table", rendered: "+6.5pp [+3.7, +9.2] (t 4.6)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.luna.label}, rule: cell_ci_t}
  - {id: dec_lab_qwen, section: "§4.2 table", rendered: "+6.7pp [+4.9, +8.5] (t 7.3)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.qwen.label}, rule: cell_ci_t}
  - {id: dec_bun_ds, section: "§4.2 table", rendered: "−10.6pp [−12.7, −8.6] (t −10.0)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.deepseek.bundle}, rule: cell_ci_t}
  - {id: dec_bun_haiku, section: "§4.2 table", rendered: "−17.4pp [−20.2, −14.5] (t −11.8)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.haiku.bundle}, rule: cell_ci_t}
  - {id: dec_bun_luna, section: "§4.2 table", rendered: "−11.5pp [−15.4, −7.5] (t −5.7)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.luna.bundle}, rule: cell_ci_t}
  - {id: dec_bun_qwen, section: "§4.2 table", rendered: "−12.1pp [−14.7, −9.5] (t −9.2)", source: {file: docs/phase3/round5_stats.json, key: primary_decomposition.qwen.bundle}, rule: cell_ci_t}
  # ---- §4.1 E2 table cells ----
  - {id: e2_pm_ds, section: "§4.1 table", rendered: "| .357 | .233 | .297 | .387 |", source: {file: docs/report/stats.json, key: "models.*.e2_clustered.cells.parent|female.p"}, rule: row_3dp_ds_haiku_luna_qwen}
