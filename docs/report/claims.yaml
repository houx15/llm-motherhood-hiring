  - {id: ms4_shortlist_range, section: "ms 4.x", rendered: "71–78%", source: {file: docs/report/stats.json, key: "models.*.e3_fe.F.adjusted_ratio"}, rule: ms3_shortlist_range, target: docs/paper/manuscript.md}
