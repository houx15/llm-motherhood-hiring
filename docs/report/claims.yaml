  - {id: e2_gf_ds, section: "§4.1 table", rendered: "| .308 | .130 | .184 | .256 |", source: {file: docs/report/stats.json, key: "models.*.e2_clustered.cells.parent_gap|male.p"}, rule: row_3dp_ds_haiku_luna_qwen}
