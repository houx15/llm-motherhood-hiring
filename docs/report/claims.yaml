  - {id: cod_avail_dsq, section: "§4.2 mechanism", rendered: "(39–52% of interruption losses)", source: {file: docs/final/coding_stats.json, key: report_summary}, rule: rs_avail_dsq}
  - {id: cod_avail_hl, section: "§4.2 mechanism", rendered: "(≤ 15%)", source: {file: docs/final/coding_stats.json, key: report_summary}, rule: rs_avail_hl}
  - {id: cod_irr_losing, section: "§4.2 mechanism", rendered: "Qwen 90%, Haiku 69%, Luna 56%, DeepSeek 53%", source: {file: docs/final/coding_stats.json, key: report_summary}, rule: rs_irr_losing}
  - {id: cod_irr_won_hl, section: "§4.2 mechanism", rendered: "(64%, 50%)", source: {file: docs/final/coding_stats.json, key: report_summary}, rule: rs_irr_won_hl}
  - {id: cod_irr_won_dsq, section: "§4.2 mechanism", rendered: "(19% and 42% when the parent wins)", source: {file: docs/final/coding_stats.json, key: report_summary}, rule: rs_irr_won_dsq}
  - {id: cod_haiku_protected, section: "§4.2 mechanism", rendered: "protected characteristics 12pp more often for mothers, Holm", source: {file: docs/final/coding_stats.json, key: report_summary.haiku_protected_diff_pp}, rule: rs_pp_int}
  # ---- §2.1 / Appendix E spend ----
  - {id: spend_experiments, section: "§2.1", rendered: "$188.52", source: {file: docs/final/study_totals.json, key: grand_total.cost_excl_coding}, rule: usd_2dp}
  - {id: spend_coding, section: "§2.1", rendered: "$0.66 for rationale coding", source: {file: docs/final/study_totals.json, key: grand_total.coding_cost}, rule: usd_2dp_int}
  - {id: spend_total, section: "Appendix E", rendered: "$189.18 incl. coding", source: {file: docs/final/study_totals.json, key: grand_total.cost_usd}, rule: usd_2dp_incl}
