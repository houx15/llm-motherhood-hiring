[project]
name = "llm-hiring-audit"
version = "0.1.0"
description = "Reproducible pipeline auditing LLMs for motherhood penalties / fatherhood bonuses in hiring (correspondence audit via OpenRouter)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "kagglehub>=0.2",
    "python-dotenv>=1.0",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
audit = "audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
