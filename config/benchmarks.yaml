# Human benchmark effect sizes, Correll, Benard & Paik (2007)
# Lab study (Study 1) values verified 2026-10-16 against published summaries
# of the paper (hire rates 47% mothers vs 84% childless women; ~$11,000 lower
# recommended salary for mothers). VERIFY against the original PDF before
# publication of the paper.
correll_2007:
  study: "Correll, Benard & Paik (2007), lab study"
  hire_mothers_pct: 47.0        # % recommended for hire
  hire_childless_women_pct: 84.0
  hire_mother_penalty_pp: -37.0
  salary_gap_usd: -11000        # childless women offered ~$11k more (≈ −7.4%, commonly cited; verify vs paper tables)
  salary_penalty_pct: -7.4
  competence_mother_std: -0.36  # directional, from paper figures
  commitment_mother_std: -0.87
  audit_note: "employer audit: mothers received roughly half the callbacks of childless women"

