# Pinned model slugs. NEVER use *-latest aliases (spec §0.3).
# Prices are USD per 1M tokens from OpenRouter /api/v1/models (verified at build time);
# the client re-verifies live at startup and uses max(live, config) for budgeting.
models:
  - key: deepseek_v41_flash
    slug: deepseek/deepseek-v4.1-flash
    verified: true            # slug + prices confirmed live on OpenRouter 2026-10-14
    provider: {order: ["DeepSeek"], allow_fallbacks: false}
    reasoning: {enabled: false}   # identical across all runs
    temperature: null             # null = omit (provider default, consumer-like)
    max_tokens: 600
    price_per_mtok: {input: 0.016, output: 0.891}   # live OpenRouter price 2026-10-14
    peak_multiplier: 2.0          # DeepSeek peak hours (UTC 00:30-16:30) double price
    peak_hours_utc: ["00:30", "16:30"]
  - key: claude_haiku_55
    slug: anthropic/claude-haiku-5.5
    verified: false           # verify slug + price before Phase 2
    provider: {order: ["Anthropic"], allow_fallbacks: false}
    reasoning: {enabled: false}
    temperature: null
    max_tokens: 600
    price_per_mtok: {input: 0.10, output: 0.50}
    peak_multiplier: 1.0
  - key: qwen38_flash
    slug: qwen/qwen3.8-flash
    verified: false
    provider: {order: ["Alibaba"], allow_fallbacks: false}
    reasoning: {enabled: false}
    temperature: null
    max_tokens: 600
    price_per_mtok: {input: 0.15, output: 0.47}
    peak_multiplier: 1.0
  - key: gpt5_mini
    slug: openai/gpt-5-mini
    verified: false
    provider: {order: ["OpenAI"], allow_fallbacks: false}
    reasoning: {enabled: false}
    temperature: null
    max_tokens: 600
    price_per_mtok: {input: 0.25, output: 2.00}
    peak_multiplier: 1.0
